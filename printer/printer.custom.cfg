# ACE swap speed-up, step A (2026-10-24): faster purge. Revert: restore printer.custom.cfg.bak-20261023-2017 and power-cycle.
[filament_hub]
flush_multiplier: 1.0
max_length_per_extrude: 300
delay_before_throw: 2
fan_on_duration: 3
fan_off_duration: 1
# sweep_speed: 10  (now set by the nozzle-purge block below)

# ACE swap speed-up, step B+C (2026-10-24): faster ACE feed and unwind. Revert: restore printer.custom.cfg.bak-20261023-2027 and power-cycle.
[filament_hub]
v1_feed_speed: 60
default_feed_speed: 60
v1_unwind_speed: 40
default_unwind_speed: 40
unwind_speed_old_ace: 40

# ACE swap speed-up, step D (2026-10-24): faster, capped purge for the 0.8 nozzle. Revert: restore printer.custom.cfg.bak-20261023-2035 and power-cycle.
[filament_hub]
# sweep_speed: 13  (now set by the nozzle-purge block below)
flush_volume_max: 450

# ACE swap speed-up, step E (2026-10-24): shorter fixed unwind after the head switch clears; the tracker-based unwind to the safe position still follows. Revert: restore printer.custom.cfg.bak-20261023-2045 and power-cycle.
[filament_hub]
unwind_length_after_triggered: 500

# BEGIN nozzle-purge (managed by the nozzle-purge Rinkhals app, do not edit)
# nozzle: 0.8
[filament_hub]
sweep_speed: 13
# END nozzle-purge
