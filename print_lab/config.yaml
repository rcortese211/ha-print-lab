name: Print Lab
version: "0.5.4"
slug: print_lab
description: Headless PrusaSlicer + OpenSCAD, run from an external drive
url: https://github.com/rcortese211/ha-print-lab
arch:
  - aarch64
init: false
startup: services
boot: auto
full_access: true
apparmor: false
privileged:
  - SYS_ADMIN
options:
  drive_label: HA_Expand
  rootfs_gb: 12
  debian_suite: trixie
  watch_crops: "0.28,0.2,0.42,0.42;0.28,0.45,0.42,0.42"
schema:
  drive_label: str
  rootfs_gb: int(4,64)
  debian_suite: str
  watch_crops: str?
