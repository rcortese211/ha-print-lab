# Anycubic Kobra S1, 0.4 nozzle, PLA, 0.20mm standard.
# Values taken from Anycubic's official OrcaSlicer profile; start G-code is the
# firmware's own G9111 macro (heat, level, purge handled by the printer).
printer_technology = FFF
printer_model =
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 250
gcode_flavor = klipper
nozzle_diameter = 0.8
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.6
retract_speed = 30
deretract_speed = 0
retract_lift = 0.4
retract_lift_above = 0.3
retract_lift_below = 249
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
retract_before_wipe = 70%
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_feedrate_x = 600
machine_max_feedrate_y = 600
machine_max_feedrate_z = 15
machine_max_feedrate_e = 80
machine_max_jerk_x = 9
machine_max_jerk_y = 9
machine_max_jerk_z = 3
machine_max_jerk_e = 2.5
start_gcode = G9111 bedTemp={first_layer_bed_temperature[0]} extruderTemp={first_layer_temperature[0]}\nM117
end_gcode = G92 E0\nG1 E-2 F3000\n{if max_layer_z < max_print_height-1}G1 Z{z_offset+min(max_layer_z+10, max_print_height)} F1800 ; Move print head further up{endif}\nG1 F12000 ; present print\nG1 X44\nG1 Y270\nM140 S0 ; turn off heatbed\nM104 S0 ; turn off hotend\nM106 P1 S0 ; turn off fans\nM106 P2 S0\nM106 P3 S0\nM84 ; disable motors
before_layer_gcode = ;BEFORE_LAYER_CHANGE [layer_num] @ [layer_z]mm
layer_gcode = ;AFTER_LAYER_CHANGE [layer_num] @ [layer_z]mm
autoemit_temperature_commands = 0
# --- filament: Anycubic PLA ---
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1.02
temperature = 220
first_layer_temperature = 225
bed_temperature = 55
first_layer_bed_temperature = 55
filament_max_volumetric_speed = 15
fan_always_on = 1
cooling = 1
min_fan_speed = 60
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
fan_below_layer_time = 100
slowdown_below_layer_time = 4
min_print_speed = 20
# --- process: 0.20mm standard ---
layer_height = 0.4
first_layer_height = 0.3
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
top_solid_min_thickness = 1
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
fill_angle = 45
extrusion_width = 0.82
first_layer_extrusion_width = 0.9
perimeter_extrusion_width = 0.82
external_perimeter_extrusion_width = 0.82
infill_extrusion_width = 0.82
solid_infill_extrusion_width = 0.85
top_infill_extrusion_width = 0.9
perimeter_speed = 120
external_perimeter_speed = 60
small_perimeter_speed = 50%
infill_speed = 100
solid_infill_speed = 150
top_solid_infill_speed = 60
gap_fill_speed = 100
bridge_speed = 30
travel_speed = 300
first_layer_speed = 20
first_layer_infill_speed = 30
support_material_speed = 100
default_acceleration = 10000
perimeter_acceleration = 5000
external_perimeter_acceleration = 5000
infill_acceleration = 10000
solid_infill_acceleration = 5000
top_solid_infill_acceleration = 2000
bridge_acceleration = 5000
first_layer_acceleration = 500
travel_acceleration = 10000
seam_position = rear
support_material = 0
support_material_auto = 1
support_material_style = organic
support_material_threshold = 30
support_material_buildplate_only = 1
support_material_contact_distance = 0.18
skirts = 2
brim_type = outer_only
brim_width = 0
thin_walls = 0
avoid_crossing_perimeters = 0
gcode_comments = 0
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode
min_layer_height = 0.16
max_layer_height = 0.6
infill_overlap = 30%
ironing = 1
ironing_type = top
ironing_flowrate = 15%
ironing_spacing = 0.3
ironing_speed = 20
skirt_distance = 5
skirt_height = 1
min_skirt_length = 40
arc_fitting = emit_center
gcode_resolution = 0.05
